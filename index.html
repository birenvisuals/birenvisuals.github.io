<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biren Visuals</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#ffffff;
            color:#111;
        }

        nav{

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:25px 80px;

            border-bottom:1px solid #ececec;

        }

        .logo{

            font-size:28px;
            font-weight:bold;

        }

        nav ul{

            display:flex;
            list-style:none;
            gap:40px;

        }

        nav a{

            text-decoration:none;
            color:#111;

        }

        .hero{

            height:90vh;

            display:flex;
            justify-content:center;
            align-items:center;
            flex-direction:column;

            text-align:center;

        }

        h1{

            font-size:72px;
            margin-bottom:20px;

        }

        h2{

            font-size:32px;
            margin-bottom:25px;

        }

        p{

            font-size:20px;
            color:#666;
            max-width:700px;

        }

        button{

            margin-top:40px;

            padding:18px 45px;

            background:#111;

            color:white;

            border:none;

            cursor:pointer;

            font-size:18px;

        }

        button:hover{

            background:#444;

        }

    </style>

</head>

<body>

<nav>

<div class="logo">

Biren Visuals

</div>

<ul>

<li><a href="#">Portfolio</a></li>

<li><a href="#">About</a></li>

<li><a href="#">Contact</a></li>

</ul>

</nav>

<section class="hero">

<h1>Biren Visuals</h1>

<h2>3D Furniture Artist</h2>

<p>

Creating premium furniture assets for architecture,
interior visualization and games.

</p>

<button>

Explore Portfolio

</button>

</section>

</body>

</html>
